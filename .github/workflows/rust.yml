name: Rust backend
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libasound2-dev libsdl2-2.0-0 ffmpeg python3
      - name: Rust tests (Qt legacy target excluded)
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --locked -p waniengine-core -p waniengine-daemon -p waniengine-wayland -p waniengine-egui
      - name: Installer regression
        run: python3 tests/test-installer.py
      - name: FFmpeg timing and frame cap
        run: cargo test --locked -p waniengine-wayland -- --ignored
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Build desktop test binary
        run: cargo build --locked -p waniengine-egui && strip --strip-unneeded target/debug/waniengine-egui
      - name: Private GNOME and Xfce sessions
        run: |
          python3 tests/desktops/fetch-ding.py
          docker build -t waniengine-desktop-tests:local -f tests/desktops/Dockerfile .
          chmod -R a+rwX target/desktop-matrix
          for desktop in gnome xfce; do
            docker run --rm --init --ulimit core=0 --network none --memory 2g --memory-swap 2g --cpus 1 --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges -e WANIENGINE_TEST_DING=1 --mount type=bind,source="$PWD",target=/workspace,readonly --mount type=bind,source="$PWD/target/desktop-matrix",target=/results waniengine-desktop-tests:local bash tests/desktops/run.sh "$desktop"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-desktop-results
          path: |
            target/desktop-matrix/gnome
            target/desktop-matrix/xfce
