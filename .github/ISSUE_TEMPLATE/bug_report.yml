name: Bug report
description: Report a reproducible problem with WaniEngine.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove personal paths, media names, and other private information from logs or screenshots.
  - type: input
    id: version
    attributes:
      label: WaniEngine version
      placeholder: "0.2.0 or commit hash"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Desktop environment
      description: Include your distribution, KDE Plasma version, Wayland session, Qt version, and graphics driver when known.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove private data before sharing.
