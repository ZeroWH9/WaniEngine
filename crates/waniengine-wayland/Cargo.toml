[package]
name = "waniengine-wayland"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde.workspace = true
serde_json.workspace = true
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
x11rb = { version = "0.13.2", default-features = false, features = ["randr", "shape"] }

tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }
libc = "0.2.190"

[dev-dependencies]
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
