[workspace]
members = [
    "crates/waniengine-core",
    "crates/waniengine-daemon",
    "crates/waniengine-app",
    "crates/waniengine-egui",
    "crates/waniengine-wayland",
]
# Keep the regular workspace build on the Rust manager. The Qt host remains an
# explicit package target only while its features are being migrated.
default-members = [
    "crates/waniengine-core",
    "crates/waniengine-daemon",
    "crates/waniengine-egui",
    "crates/waniengine-wayland",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
