[workspace]
members = [
    "crates/waniengine-core",
    "crates/waniengine-daemon",
    "crates/waniengine-app",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
